[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "worldcast-lab"
version = "0.1.0"
description = "A reproducible synthetic world for time-series foundation model research"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Dipayan Dey"}]
dependencies = ["numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.3"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4"]

[project.scripts]
worldcast = "worldcast.cli:main"

[tool.setuptools.packages.find]
include = ["worldcast*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
